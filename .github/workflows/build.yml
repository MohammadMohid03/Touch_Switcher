name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build TouchSwitcher.sln -c Release
      - run: powershell -File scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TouchSwitcher
          path: artifacts/TouchSwitcher.exe
